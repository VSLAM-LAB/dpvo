[build-system]
requires = ["setuptools>=77", "torch", "pybind11", "cmake"]
build-backend = "setuptools.build_meta"

[project]
name = "dpvo"
version = "1.0"
description = "Deep Patch Visual Odometry/SLAM"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lahav Lipson" }, { name = "Zachary Teed" }, { name = "Jia Deng" }]
requires-python = ">=3.9"

[project.scripts]
vslamlab_dpvo_mono = "vslamlab_dpvo_mono:main"

[project.urls]
Homepage = "https://github.com/princeton-vl/DPVO"
Repository = "https://github.com/VSLAM-LAB/dpvo"
