# Builds the dpvo conda package (CUDA 12.6 and 12.9 variants, see pixi.toml [package] and variants.yaml) on every
# push to main, and publishes it to https://prefix.dev/vslamlab/vslamlab when a version tag (vX.Y) is pushed.
# Publishing uses prefix.dev trusted publishing (OIDC): prefix.dev > Settings > Repository Access > GitHub,
# repository VSLAM-LAB/dpvo, workflow conda-package.yml, read/write on vslamlab/vslamlab. No API key is stored.
#
# Release: bump `version` in pixi.toml and pyproject.toml, push to main, check it on a GPU (VSLAM-LAB dpvo-dev),
# then `git tag vX.Y && git push origin vX.Y`.
name: conda-package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive  # DBoW2 (compiled into dpretrieval)

      # Two CUDA/PyTorch build environments do not fit in the runner's default free space
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          pixi = tomllib.load(open('pixi.toml', 'rb'))['package']['version']
          pyproject = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if not tag == pixi == pyproject:
              sys.exit(f'tag v{tag} does not match pixi.toml [package] version {pixi} / pyproject.toml version {pyproject}')
          print(f'version {tag} OK')
          EOF

      # --clean: pixi reuses its build directory otherwise, and stale files end up in the package
      - name: Build both CUDA variants into a local channel
        run: pixi publish --clean --to "file://$PWD/channel"

      - name: Inspect packages
        run: |
          shopt -s nullglob
          pkgs=(channel/linux-64/dpvo-*.conda)
          [ ${#pkgs[@]} -eq 2 ] || { echo "expected 2 packages, found ${#pkgs[@]}"; exit 1; }
          for pkg in "${pkgs[@]}"; do
            echo "== $pkg"
            tmp=$(mktemp -d)
            unzip -q "$pkg" -d "$tmp"
            files=$(tar --zstd -tf "$tmp"/pkg-*.tar.zst)
            sp=lib/python3.11/site-packages
            for f in bin/vslamlab_dpvo_mono $sp/dpvo/dpvo.py $sp/dpviewer/__init__.py \
                     $sp/cuda_corr.cpython-311-x86_64-linux-gnu.so $sp/cuda_ba.cpython-311-x86_64-linux-gnu.so \
                     $sp/lietorch_backends.cpython-311-x86_64-linux-gnu.so \
                     $sp/dpviewerx.cpython-311-x86_64-linux-gnu.so $sp/dpretrieval.cpython-311-x86_64-linux-gnu.so; do
              grep -qx "$f" <<< "$files" || { echo "missing $f"; exit 1; }
            done
            n=$(grep -c 'dist-info/METADATA$' <<< "$files")
            [ "$n" -eq 1 ] || { echo "expected 1 dist-info, found $n"; exit 1; }
          done

      # No GPU on the runner: CONDA_OVERRIDE_CUDA lets the solver accept the CUDA packages. dpvo.dpvo (and so the
      # vslamlab_dpvo_mono entry point) creates a CUDA tensor at import, so it is left out here; the bin/ script is
      # checked by the inspect step and the full import runs in the dev environment's `pixi run test`
      - name: Test each variant
        run: |
          for cuda in 12.6 12.9; do
            echo "== CUDA $cuda"
            CONDA_OVERRIDE_CUDA=$cuda pixi exec \
              -c "file://$PWD/channel" -c https://prefix.dev/vslamlab/vslamlab -c https://prefix.dev/conda-forge \
              -s dpvo -s "cuda-version=$cuda.*" -s python=3.11 -- \
              python -I -c 'import dpvo.net, dpvo.config, cuda_corr, cuda_ba, lietorch_backends, dpviewerx, dpretrieval, pypose; from dpviewer import Viewer; print(Viewer)'
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dpvo-packages
          path: channel/linux-64/dpvo-*.conda

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dpvo-packages
          path: packages

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      # --skip-existing: a re-run after a partial upload never overwrites a published file
      - name: Upload to prefix.dev
        run: pixi exec rattler-build upload prefix --skip-existing --channel vslamlab/vslamlab packages/*.conda
